name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24' # current Node.js LTS

jobs:
  ci:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (api + web)
        run: pnpm test

      - name: Build (api + web)
        run: pnpm build

  e2e-api:
    name: API e2e (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pasarela
          POSTGRES_PASSWORD: pasarela
          POSTGRES_DB: pasarela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pasarela -d pasarela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pasarela:pasarela@localhost:5432/pasarela
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter api

      - name: Run migrations
        run: pnpm --filter api migration:run

      - name: E2E tests
        run: pnpm --filter api test:e2e

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/api/v1/health
          echo
          curl -fsS http://localhost:4200/api/v1/health   # through the nginx /api proxy
          echo
          curl -fsS http://localhost:4200/ | grep -q '<app-root'
          curl -fsS http://localhost:3000/api/docs-json > /dev/null
          # Merchant sign-up through the nginx proxy (same origin as the SPA).
          TOKEN=$(curl -fsS -X POST http://localhost:4200/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"Smoke-passw0rd","full_name":"Smoke Test","business_name":"Tienda Smoke"}' \
            | jq -er .access_token)
          curl -fsS http://localhost:4200/api/v1/auth/me -H "Authorization: Bearer $TOKEN" \
            | jq -e '.merchant.business_name == "Tienda Smoke"'
          # Roll the secret key (shown once) and call the merchant API with it.
          SK=$(curl -fsS -X POST http://localhost:4200/api/v1/dashboard/api-keys/roll \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"type":"secret"}' | jq -er .secret)
          curl -fsS http://localhost:4200/api/v1/account -H "Authorization: Bearer $SK" \
            | jq -e '.object == "account" and .livemode == false'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e-web:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter web

      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Playwright (desktop + mobile)
        run: pnpm --filter web e2e
        env:
          E2E_BASE_URL: http://localhost:4200

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
